name: Deploy marketplace pages

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'releases/**'
      - 'skills/**'
      - 'index.json'
      - '.github/workflows/pages.yml'
  # GITHUB_TOKEN 的推送不会触发 push 工作流，定时同步后单独补一次部署
  workflow_run:
    workflows: ['Sync plugin releases']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 定时同步失败时不要用旧内容覆盖 Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
