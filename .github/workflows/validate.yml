name: Validate metadata

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'schema/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'schema/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate plugin metadata
        run: python3 scripts/validate_metadata.py
