name: Sync plugin releases

on:
  schedule:
    # 轻量同步：只跟 source=external（公开源码仓）的 Releases，不重新下载市场仓资产
    - cron: '*/30 * * * *'
    # 全量校验：含 source=market 插件包的 sha256 复核
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync releases and rebuild index.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=""
          if [ "${{ github.event.schedule }}" = "*/30 * * * *" ]; then
            args="--source external"
          fi
          python3 scripts/build_index.py $args
      - name: Validate metadata
        run: python3 scripts/validate_metadata.py
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "索引无变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync plugin releases"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash origin main
            [ "$attempt" = "5" ] && exit 1
          done
